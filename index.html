    <h1>Rock Paper Scissors</h1>
    
    <div class="choices">
        <button id="rock">🪨 Rock</button>
        <button id="paper">📄 Paper</button>
        <button id="scissors">✂️ Scissors</button>

    <div class="results">
        <p id="player-choice">Player: </p>
        <p id="computer-choice">Computer: </p>
        <h2 id="outcome">Choose your weapon!</h2>
    </div>
